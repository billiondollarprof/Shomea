# .github/workflows/ci.yml
#
# WHAT THIS IS
# ------------
# The check that runs on every push. It has to pass before anything is
# trusted, and it is the only place where "it builds" is proved by a
# machine rather than claimed in a message.
#
# WHY ANTHONY NEEDS IT MORE THAN MOST PROJECTS
# --------------------------------------------
# He has a phone and an iPad and no laptop, so he cannot run a build and he
# cannot see an error in a terminal. Without this, a broken build reaches
# him as a Cloudflare deployment that silently did not update.
#
# WHAT IT MUST NEVER DO
# ---------------------
# It must never deploy. Cloudflare Pages watches the repository itself and
# does its own build. Two things deploying the same app is how a site ends
# up showing a version nobody pushed.
#
# JOBS
# ----
#   1. build    the app compiles, and nothing is over Cloudflare's file cap
#   2. rules    the parts of CLAUDE.md a machine can check

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -------------------------------------------------------------------------
  # 1. The app compiles, and the deployment would actually be accepted
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # .npmrc carries ignore-scripts, because onnxruntime-node tries to
      # download a binary we do not need and never use in a browser.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # THE CHECK THAT MATTERS MOST HERE.
      #
      # Cloudflare Pages refuses any single file over 25 MiB. It has already
      # bitten once: the bundler folded the speech engine into the build and
      # produced a 26.8 MB file, which would have been rejected with an error
      # that explained nothing.
      #
      # So the size is checked here, where it is cheap, instead of being
      # found as a failed deployment.
      - name: Nothing over Cloudflare's file limit
        run: |
          LIMIT=$((25 * 1024 * 1024))
          FAILED=0
          while IFS= read -r file; do
            SIZE=$(stat -c%s "$file")
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "TOO BIG: $file is $((SIZE / 1024 / 1024)) MB. Cloudflare Pages refuses anything over 25 MiB."
              FAILED=1
            fi
          done < <(find dist -type f)
          if [ "$FAILED" -eq 1 ]; then
            echo "See the comment in vite.config.js about onnxruntime-web-use-extern-wasm."
            exit 1
          fi
          echo "Largest file in dist:"
          find dist -type f -printf '%s %p\n' | sort -rn | head -1 | awk '{printf "%.2f MB  %s\n", $1/1048576, $2}'

  # -------------------------------------------------------------------------
  # 2. The house rules
  # -------------------------------------------------------------------------
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the house rules
        run: python3 scripts/check_house_rules.py
