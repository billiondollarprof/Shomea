# .github/workflows/convert-model.yml
#
# WHAT THIS IS
# ------------
# It takes a Whisper model trained on Nigerian speech, turns it into
# something a browser can run, and puts it where Shomea can load it.
#
# WHY IT IS A WORKFLOW AND NOT A SCRIPT SOMEBODY RUNS
# ---------------------------------------------------
# Three reasons, and all three are hard limits rather than preferences.
#
#   1. Anthony has a phone and an iPad. He cannot run a Python export.
#   2. An agent session cannot reach huggingface.co. A runner can.
#   3. The result is larger than the 25 MiB Cloudflare Pages allows, so it
#      has to go to R2, and that needs a token that lives in secrets.
#
# IT IS RUN BY HAND, NOT ON EVERY PUSH
# ------------------------------------
# A conversion downloads gigabytes and takes a long time. Nothing about a
# normal push needs it to happen again. Start it from the Actions tab.
#
# WHAT IT NEEDS, ONCE
# -------------------
#   CLOUDFLARE_API_TOKEN   with R2 Edit, D1 Edit and Pages Edit
#   CLOUDFLARE_ACCOUNT_ID
#
# Both are repository secrets. The workflow makes the bucket and the
# binding itself, so there is nothing to click in the dashboard.

name: Convert a speech model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model id"
        required: true
        default: "NCAIR1/NigerianAccentedEnglish"
      name:
        description: "What to call it in Shomea, lower case, no spaces"
        required: true
        default: "nigerian-whisper-small"
      quantise_encoder:
        description: "Shrink the encoder too. Costs accuracy. Usually no."
        type: boolean
        default: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # A Whisper export needs room. The runner ships with several
      # gigabytes of tooling nothing here uses, and reclaiming it is the
      # difference between finishing and running out of disk.
      - name: Make room on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE PACKAGE NAME MATTERS AND IT CHANGED.
      #
      # The first run of this workflow failed here, instantly, with:
      #
      #   No module named optimum.exporters.onnx
      #
      # Optimum 2.0 moved ONNX export out of the main package into its own,
      # called optimum-onnx. Installing "optimum[exporters]" now gets you
      # Optimum with no exporter in it, which fails only once the long part
      # is already over.
      #
      # The import path did not change, so the script below is untouched.
      # Only the thing being installed is different.
      - name: Install the exporter
        run: |
          python -m pip install --upgrade pip
          pip install "optimum-onnx[onnxruntime]" onnx "transformers<5" torch --extra-index-url https://download.pytorch.org/whl/cpu

      # Fail here, in one second, rather than after a model has downloaded.
      # The first run spent three minutes getting to a missing import.
      - name: Check the exporter is actually there
        run: |
          python -c "import optimum.exporters.onnx; print('Exporter found.')" || {
            echo ""
            echo "The ONNX exporter did not install."
            echo "Optimum 2.0 moved it into a package called optimum-onnx."
            echo "Installed packages that mention optimum:"
            pip list 2>/dev/null | grep -i optimum || echo "  none"
            exit 1
          }

      # IS THE MODEL EVEN REACHABLE? Ask before downloading gigabytes.
      #
      # Run 2 failed here, after the install, with a 401: the NCAIR1 model
      # is gated, meaning its owner has to grant you access before Hugging
      # Face will serve it. That is not something a retry fixes.
      #
      # This asks for one small file first, so a permission problem is
      # reported in seconds, in plain words, instead of as a stack trace.
      - name: Check the model can be reached
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import hf_hub_download
          from huggingface_hub.utils import GatedRepoError, RepositoryNotFoundError

          model = "${{ inputs.model }}"
          token = os.environ.get("HF_TOKEN") or None

          try:
              hf_hub_download(model, "config.json", token=token)
              print(f"{model} can be reached.")
          except GatedRepoError:
              print(f"\n{model} is GATED. Somebody has to be given access to it.")
              print("")
              print("To use this one:")
              print(f"  1. Open https://huggingface.co/{model} and request access")
              print("  2. Make a read token at https://huggingface.co/settings/tokens")
              print("  3. Add it to this repository as a secret called HF_TOKEN")
              print("")
              print("Or run this workflow again with a model that is not gated.")
              sys.exit(1)
          except RepositoryNotFoundError:
              print(f"\n{model} does not exist, or the name is spelt wrong.")
              sys.exit(1)
          PY

      - name: Convert
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/convert_model.py \
            --model "${{ inputs.model }}" \
            --output "build/${{ inputs.name }}" \
            ${{ inputs.quantise_encoder && '--quantise-encoder' || '' }}

      - name: Install wrangler
        run: npm install -g wrangler@latest

      # Making a bucket that already exists is not an error worth stopping
      # for, so a second run is safe.
      - name: Make the bucket if it is not there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 bucket create shomea-models || true

      - name: Upload the model
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME="${{ inputs.name }}"
          cd "build/$NAME"
          find . -type f | while read -r file; do
            KEY="$NAME/${file#./}"
            echo "Uploading $KEY"
            wrangler r2 object put "shomea-models/$KEY" --file "$file" --remote
          done

      # The app reads the model through a Pages Function, so the bucket
      # never has to be public and there is no cross origin problem. That
      # Function needs a binding, and a binding can be set through the API,
      # which means nobody has to find it in a dashboard.
      - name: Bind the bucket to the Pages project
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/shomea" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_configs": {
                "production": { "r2_buckets": { "MODELS": { "name": "shomea-models" } } },
                "preview":    { "r2_buckets": { "MODELS": { "name": "shomea-models" } } }
              }
            }' | python3 -c "import json,sys; r=json.load(sys.stdin); print('Binding set.' if r.get('success') else 'Binding FAILED: ' + json.dumps(r.get('errors')))"

      - name: What to do next
        run: |
          echo "Model uploaded as '${{ inputs.name }}'."
          echo ""
          echo "It will be served at https://shomea.pages.dev/models/${{ inputs.name }}/..."
          echo "Add it to src/listening/models.js with local: true, then redeploy."
          cat "build/${{ inputs.name }}/SIZE.json"
